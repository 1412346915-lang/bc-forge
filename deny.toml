# cargo-deny configuration for bc-forge workspace (#958)

[advisories]
# cargo-deny 0.20 treats these as which dependency set to scan, not a severity.
vulnerability = "deny"
unmaintained = "none"
notice = "none"
ignore = []

[licenses]
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
